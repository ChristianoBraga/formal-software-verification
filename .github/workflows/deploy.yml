name: Deploy lecture notes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Read Mathlib rev from manifest
        id: mathlib-rev
        run: |
          rev="$(jq -r '.packages[] | select(.name == "mathlib") | .rev' lake-manifest.json)"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"

      # Compressed Mathlib olean archives (~3.6 GB). `lake exe cache get`
      # decompresses them into .lake/packages/mathlib/.lake, so those
      # artifacts (~6.4 GB) are excluded from the Lake cache below.
      - name: Cache Mathlib cache archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/mathlib
          key: mathlib-${{ steps.mathlib-rev.outputs.rev }}
          restore-keys: |
            mathlib-

      - name: Cache Lake build
        uses: actions/cache@v4
        with:
          path: |
            .lake
            !.lake/packages/mathlib/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}

      - name: Get Mathlib build cache
        run: lake exe cache get

      - name: Build English site
        run: lake exe lectures-en --output _out/en

      - name: Build Portuguese site
        run: lake exe lectures-pt --output _out/pt

      - name: Build slide decks
        run: |
          lake exe slides-en --output _out/slides-en
          lake exe slides-pt --output _out/slides-pt

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          version="$(git log -1 --format='%cs+%h')"
          sed -i "s/__SITE_VERSION__/$version/" _site/index.html
          cp -r _out/en/html-multi _site/en
          cp -r _out/pt/html-multi _site/pt
          mkdir -p _site/slides
          cp _out/slides-en/*.html _out/slides-pt/*.html _site/slides/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
