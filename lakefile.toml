name = "lectures"
defaultTargets = ["Lectures"]

[[require]]
name = "verso"
git = "https://github.com/leanprover/verso"
rev = "v4.32.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "Lectures"

[[lean_exe]]
name = "lectures-en"
root = "LecturesEnMain"

[[lean_exe]]
name = "lectures-pt"
root = "LecturesPtMain"

[[lean_exe]]
name = "slides-en"
root = "SlidesEnMain"

[[lean_exe]]
name = "slides-pt"
root = "SlidesPtMain"
